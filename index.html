<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nancy | Portfolio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="light-bg"></div>
    
    <header>
        <div class="header-buttons">
            <button id="btn-lang">EN</button>
            <button id="btn-about">About</button>
        </div>
    </header>

    <main id="app"></main>

    <div id="viewerLayer" class="viewer-layer">
        <button class="viewer-close">&times;</button>
        <div class="viewer-container">
            <div class="viewer-media-box" id="viewerMedia"></div>
            <div class="viewer-info">
                <h2 id="vTitle">Title</h2>
                <p id="vTag" class="v-tag"></p >
                <div id="vDesc" class="v-desc"></div>
                <div class="viewer-nav">
                    <button id="vPrev">PREV</button>
                    <button id="vNext">NEXT</button>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
